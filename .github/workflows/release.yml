name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Repository secrets: NOTIVAULT_KEYSTORE_BASE64, NOTIVAULT_KEYSTORE_PASSWORD, NOTIVAULT_KEY_ALIAS, NOTIVAULT_KEY_PASSWORD
      - name: Restore signing key
        run: echo "${{ secrets.NOTIVAULT_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build signed release APK and bundle
        env:
          NOTIVAULT_KEYSTORE_PATH: release.jks
          NOTIVAULT_KEYSTORE_PASSWORD: ${{ secrets.NOTIVAULT_KEYSTORE_PASSWORD }}
          NOTIVAULT_KEY_ALIAS: ${{ secrets.NOTIVAULT_KEY_ALIAS }}
          NOTIVAULT_KEY_PASSWORD: ${{ secrets.NOTIVAULT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Remove key
        if: always()
        run: rm -f release.jks
